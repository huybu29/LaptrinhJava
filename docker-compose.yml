version: '3.8'

services:
  # ====================================================
  # 1. INFRASTRUCTURE (HẠ TẦNG)
  # ====================================================
  
  # Eureka Server
  eureka-server:
    build: ./backend/eureka-server
    container_name: micro_eureka
    ports:
      - "8761:8761"
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MySQL (Database Chính)
  mysql:
    image: mysql:8.0
    container_name: micro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306" # Host 3308 để tránh trùng port máy thật
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - micro_net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache NiFi
  nifi:
    image: apache/nifi:latest
    container_name: micro_nifi
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    ports:
      - "8443:8443"
    networks:
      - micro_net

  # ====================================================
  # 2. MICROSERVICES (BACKEND)
  # ====================================================

  user-service:
    build: ./backend/userService
    container_name: micro_user
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  booking-service:
    build: ./backend/bookingService
    container_name: micro_booking
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  station-service:
    build: ./backend/StationService
    container_name: micro_station
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8089
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/station_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  payment-service:
    build: ./backend/paymentService
    container_name: micro_payment
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  vehicle-battery-service:
    build: ./backend/Vehicle-BatteryService
    container_name: micro_vehicle_battery
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vehicle_battery_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  support-service:
    build: ./backend/SupportService
    container_name: micro_support
    restart: on-failure
    networks:
      - micro_net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/support_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Ép dùng MySQL Driver
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # ====================================================
  # 3. API GATEWAY
  # ====================================================
  api-gateway:
    build: ./backend/api-gateway
    container_name: micro_gateway
    ports:
      - "8067:8067"
    networks:
      - micro_net
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      station-service:
        condition: service_started
      vehicle-battery-service:
        condition: service_started
      support-service:
        condition: service_started

  # ====================================================
  # 4. FRONTEND
  # ====================================================
  frontend:
    build: ./frontend
    container_name: micro_frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - micro_net
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  nifi_data:

networks:
  micro_net:
    driver: bridge
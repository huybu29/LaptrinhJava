server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình cho React Router (quan trọng)
    # Nếu không tìm thấy file thực tế, chuyển hướng về index.html để React xử lý routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình Proxy để gọi API sang Gateway (Tùy chọn nhưng khuyên dùng)
    # Ví dụ: Frontend gọi /api/users -> Nginx đẩy sang http://api-gateway:8067/users
    location /api/ {
        # 'api-gateway' là tên service trong docker-compose.yml
        proxy_pass http://api-gateway:8067/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
server:
  port: 8086

spring:
  application:
    name: support-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    discovery:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    register-with-eureka: true      # 🔹 Bật đăng ký service
    fetch-registry: true            # 🔹 Cho phép lấy thông tin từ Eureka
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: support-service      
    prefer-ip-address: true   
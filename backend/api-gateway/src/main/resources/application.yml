server:
  port: 8067

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter  
        - id: auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter
        - id: station-service
          uri: lb://station-service
          predicates:
            - Path=/api/stations/**
          filters:
            - JwtAuthFilter
        - id: vehicle-battery-service
          uri: lb://vehicle-battery-service
          predicates:
            - Path=/api/vehicles/**, /api/batteries/**
            
          filters:
            - JwtAuthFilter   
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/appointments/**
          filters:
            - JwtAuthFilter   
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**, /api/invoices/**, /api/battery-packages/** 
          filters:
            - JwtAuthFilter
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/api/tickets/**, /api/notifications/**
          filters:
              - JwtAuthFilter


             
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # <-- dùng tên service container
    registerWithEureka: true
    fetchRegistry: true
